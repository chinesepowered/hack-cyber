[project]
name = "beagle-brigade"
version = "0.1.0"
description = "Real-time malicious package detection for npm and PyPI"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.scripts]
beagle = "beagle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beagle"]

[tool.ruff]
line-length = 100
